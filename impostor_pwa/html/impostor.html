<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <link rel="stylesheet" href="../css/impostor-styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>El Impostor - Juego</title>
</head>
<body>
    <div class="game-container">
        <div class="top-nav">
            <button id="backToHomeBtn" class="back-btn">← Volver al inicio</button>
        </div>
        
        <div class="header-text">
            <p>Pasale el celular a:</p>
            <h2 id="currentPlayerName">NOMBRE</h2>
        </div>
        
        <div class="card-container">
            <div class="game-card">
                <p id="roleInstruction">MANTENÉ PRESIONADO<br>PARA REVELAR<br>EL JUGADOR</p>
            </div>
        </div>
        
        <div class="bottom-section">
            <button id="nextPlayerBtn" class="next-btn">Siguiente jugador</button>
        </div>
    </div>
    
    <script src="../js/impostor-main.js"></script>
</body>
</html>
