<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>El Impostor</title>
</head>
<body>
    <div class="home-section">
        <div class="title-section">
            <h1>El Impostor &#9917</h1>
        </div>

        <div class="player-list-section">
            <div id="emptyMessage" class="empty-message">
                Agregue jugadores para comenzar
            </div>
            <ul id="playersList">
            </ul>
        </div>

        <dialog id="playerDialog">
            <div class="dialog-content">
                <h3>Agregar Jugador</h3>
                <input type="text" id="playerInput" placeholder="Nombre del jugador">
                <div class="dialog-buttons">
                    <button id="confirmBtn">Confirmar</button>
                    <button id="cancelBtn">Cancelar</button>
                </div>
            </div>
        </dialog>

        <div class="button-section">
            <button id="addPlayerBtn" class="action-btn">agregar jugador</button>
        </div>

        <div class="start-section" id="startSection" style="display: none;">
            <button id="startGameBtn" class="start-btn">Comenzar Juego</button>
        </div>
    </div>

    <script src="../js/main.js"></script>
</body>
</html>
